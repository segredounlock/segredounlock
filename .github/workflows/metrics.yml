name: Atualizar Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar vitrine
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: segredounlock
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          config_display: large
          config_padding: 0, 8 + 11%
          config_octicon: yes
          output_action: none
          filename: github-metrics.svg
          plugins_errors_fatal: no
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_followup: yes
          plugin_achievements: no
          plugin_achievements_threshold: C
          plugin_achievements_secrets: no
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

      - name: Traduzir labels pra PT-BR
        run: |
          sudo cp /metrics_renders/github-metrics.svg ./github-metrics.svg
          sudo chown $USER ./github-metrics.svg
          python3 <<'PY'
          import re
          p="./github-metrics.svg"
          s=open(p,encoding="utf-8").read()

          # Substituições com regex (para frases com números/nomes)
          regex_subs = [
            (r"Joined GitHub (\S+) years ago", r"Entrou no GitHub há \1 anos"),
            (r"Joined GitHub (\S+) year ago", r"Entrou no GitHub há \1 ano"),
            (r"Joined GitHub (\S+) months ago", r"Entrou no GitHub há \1 meses"),
            (r"Followed by (\S+) users", r"Seguido por \1 usuários"),
            (r"Followed by (\S+) user", r"Seguido por \1 usuário"),
            (r"Following (\S+) users", r"Seguindo \1 usuários"),
            (r"Following (\S+) user", r"Seguindo \1 usuário"),
            (r"(\d[\d,\.]*) Commits", r"\1 Commits"),
            (r"(\d[\d,\.]*) Pull requests opened", r"\1 Pull requests abertos"),
            (r"(\d[\d,\.]*) Pull requests reviewed", r"\1 Pull requests revisados"),
            (r"(\d[\d,\.]*) Issues opened", r"\1 Issues abertas"),
            (r"(\d[\d,\.]*) issue comments", r"\1 comentários em issues"),
            (r"Member of (\S+) organizations", r"Membro de \1 organizações"),
            (r"Member of (\S+) organization", r"Membro de \1 organização"),
            (r"Sponsoring (\S+) repositories", r"Patrocinando \1 repositórios"),
            (r"Sponsoring (\S+) repository", r"Patrocinando \1 repositório"),
            (r"Starred (\S+) repositories", r"Favoritou \1 repositórios"),
            (r"Starred (\S+) repository", r"Favoritou \1 repositório"),
            (r"Watching (\S+) repositories", r"Observando \1 repositórios"),
            (r"Watching (\S+) repository", r"Observando \1 repositório"),
            (r"Contributed to (\S+) repositories", r"Contribuiu em \1 repositórios"),
            (r"Contributed to (\S+) repository", r"Contribuiu em \1 repositório"),
            (r"(\S+) Repositories", r"\1 Repositórios"),
            (r"(\S+) Sponsors", r"\1 Patrocinadores"),
            (r"(\S+) Stargazers", r"\1 Curtidas"),
            (r"(\S+) Forkers", r"\1 Forks"),
            (r"(\S+) Watchers", r"\1 Observadores"),
            (r"(\S+) Watcher\b", r"\1 Observador"),
            (r"(\S+) Releases", r"\1 Releases"),
            (r"(\S+) Packages", r"\1 Pacotes"),
            (r"(\S+) used\b", r"\1 usados"),
            (r"On (\S+)'s repositories", r"Nos repositórios de \1"),
            (r"estimation from (.+) edited files across (.+) commits",
             r"estimativa de \1 em arquivos editados ao longo de \2 commits"),
            (r"(\d+) Languages", r"\1 Linguagens"),
          ]
          for pat, rep in regex_subs:
            s = re.sub(pat, rep, s)

          tr = {
            "Achievements": "Conquistas",
            "Recent coding habits": "Hábitos de programação recentes",
            "Starred topics": "Tópicos favoritados",
            "Contributions calendar": "Calendário de contribuições",
            "Commits streaks": "Sequências de commits",
            "Current streak": "Sequência atual",
            "Best streak": "Melhor sequência",
            "Commits per day": "Commits por dia",
            "Highest in a day": "Recorde em um dia",
            "Average per day": "Média por dia",
            "These metrics include private contributions": "Estas métricas incluem contribuições privadas",
            "Last updated": "Última atualização",
            "Unexpected error": "Erro inesperado",
            "Most used languages": "Linguagens mais usadas",
            "Programming languages": "Linguagens de programação",
            "Activity": "Atividade",
            "Community stats": "Comunidade",
            "Overall issues and pull requests status": "Situação geral de issues e pull requests",
            "Pull requests": "Pull requests",
            "Issues": "Issues",
            "open": "abertos",
            "closed": "fechados",
            "drafts": "rascunhos",
            "skipped": "ignorados",
            "merged": "mesclados",
            "No license preference": "Sem licença preferida",
            "Reviews": "Reviews",
            "Discussions started": "Discussões iniciadas",
            "Discussions answered": "Discussões respondidas",
            "Projects": "Projetos",
            "Most active in": "Mais ativo em",
            "Lines changed": "Linhas alteradas",
            "added": "adicionadas",
            "deleted": "removidas",
            "Total time spent coding": "Tempo total programando",
            "Last 30 days activity": "Atividade dos últimos 30 dias",
            "Days with commits": "Dias com commits",
            "of total time": "do tempo total",
            "Total contributions": "Total de contribuições",
            "today": "hoje",
            "yesterday": "ontem",
            "days ago": "dias atrás",
            "a day": "um dia",
          }
          for en, pt in tr.items():
            s = s.replace(en, pt)
          open(p,"w",encoding="utf-8").write(s)
          print("traduzido")
          PY

      - name: Commitar SVG traduzido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "sem mudanças"
          else
            git commit -m "vitrine: atualizar github-metrics.svg (PT-BR)

          Co-authored-by: SegredoDev <segredounlock@users.noreply.github.com>"
            git pull --rebase -X ours && git push
          fi
